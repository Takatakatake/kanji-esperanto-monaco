<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kanji Esperanto Editor (Monaco)</title>
  <meta name="description" content="Kanji Esperanto input demo using Monaco Editor" />
  <style>
    html, body { height: 100%; margin: 0; }
    body { display:grid; grid-template-rows:minmax(0, 1fr) auto; min-height:100%; }
    #app { min-height:0; display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
    header {
      position: sticky; top: 0; z-index: 1000;
      display:flex; align-items:center; gap:12px; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 8px;
      border-bottom:1px solid #ddd; flex-wrap: wrap; background:#fff;
    }
    header h1 { font-size: 16px; margin: 0; font-weight: bold; }
    .hint { font-size: 12px; color: #666; }
    .toolbar { display:flex; gap:8px; flex-wrap: wrap; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .toolbar button, .toolbar select { font-size: 12px; padding:6px 10px; border:1px solid #ccc; background:#f8f8f8; border-radius:6px; }
    .toolbar [hidden] { display:none; }
    .toolbar button[aria-expanded="true"] { border-color:#007acc; background:#e8f2ff; color:#005a9e; }
    .toolbar button:active { background:#eee; }
    .toast { font-size: 12px; color:#157347; margin-left: auto; white-space: nowrap; }
    .toast[data-kind="error"] { color:#b00020; }
    #editor { min-height:0; overflow:hidden; }
    #assignment-lookup {
      display:none; padding:10px 16px; border-bottom:1px solid #ddd; background:#fafafa;
      grid-row:2; grid-column:1;
    }
    #assignment-lookup[data-open="true"] { display:block; }
    .lookup-controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .lookup-label { font-size:13px; font-weight:600; color:#333; }
    #lookup-query { font-size:16px; padding:7px 9px; min-width:180px; max-width:100%; border:1px solid #bbb; border-radius:6px; }
    #assignment-lookup button { font-size:12px; padding:6px 10px; border:1px solid #ccc; background:#f8f8f8; border-radius:6px; }
    #lookup-results { margin-top:8px; display:grid; gap:6px; max-height:220px; overflow:auto; }
    .lookup-item { display:grid; grid-template-columns: minmax(64px, auto) 1fr auto; gap:10px; align-items:center; padding:7px 9px; border:1px solid #e1e1e1; background:#fff; border-radius:6px; }
    .lookup-kanji { font-size:18px; line-height:1.2; }
    .lookup-root { font-family:monospace; font-size:14px; }
    .lookup-meta { color:#666; font-size:12px; white-space:nowrap; }
    .lookup-empty { color:#666; font-size:13px; padding:4px 0; }
    .lookup-more { width:100%; cursor:pointer; color:#005a9e; font-weight:600; }
    footer { font-size: 12px; color:#666; padding: 8px 16px; border-top: 1px solid #eee; }
  </style>
  <script>
    // Self-contained worker via data URL so the page works from static hosting
    window.MonacoEnvironment = { getWorkerUrl: function (_moduleId, label) {
      return `data:text/javascript;charset=utf-8,${encodeURIComponent(`
        self.MonacoEnvironment = { baseUrl: 'https://unpkg.com/monaco-editor@0.52.0/min/' };
        importScripts('https://unpkg.com/monaco-editor@0.52.0/min/vs/base/worker/workerMain.js');
      `)}`;
    }};
  </script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="data:,">
  <script src="https://unpkg.com/monaco-editor@0.52.0/min/vs/loader.js"></script>
</head>
<body>
  <div id="app">
    <header>
      <h1>Kanji Esperanto Editor</h1>
      <span class="hint">スマホは上のボタンでコピペ可能</span>
      <div class="toolbar">
        <button id="btn-copy" type="button">コピー</button>
        <button id="btn-paste" type="button">ペースト</button>
        <button id="btn-select-all" type="button">全選択</button>
        <button id="btn-share" type="button">共有</button>
        <select id="dict-select" title="漢字割当案" aria-label="漢字割当案" hidden></select>
        <button id="btn-assignment-lookup" type="button" aria-expanded="false">割当検索</button>
      </div>
      <span id="ke-toast" class="toast" aria-live="polite"></span>
    </header>
    <section id="assignment-lookup" aria-label="漢字割当検索">
      <div class="lookup-controls">
        <label class="lookup-label" for="lookup-query">割当漢字</label>
        <input id="lookup-query" type="search" placeholder="例: 良" autocomplete="off" />
        <button id="lookup-run" type="button">検索</button>
        <button id="lookup-clear" type="button">クリア</button>
      </div>
      <div id="lookup-results" aria-live="polite"></div>
    </section>
    <div id="editor" role="main" aria-label="漢字化エスペラント エディタ" data-options='{"wordBasedSuggestions":false,"quickSuggestions":{"other":false,"comments":false,"strings":false},"quickSuggestionsDelay":10,"suggest":{"showSnippets":true,"showWords":false}}'></div>
  </div>

  <script>
    window.KE_APP_VERSION = '20260621-dictionary-refresh-35';
  </script>
  <script src="./app.js?v=20260621-dictionary-refresh-35"></script>

  <script>
    if ('serviceWorker' in navigator) {
      let reloadedForServiceWorker = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloadedForServiceWorker) return;
        reloadedForServiceWorker = true;
        location.reload();
      });
      window.addEventListener('load', async () => {
        try {
          const reg = await navigator.serviceWorker.register('./sw.js?v=20260621-dictionary-refresh-35');
          await reg.update();
        } catch {}
      });
    }
  </script>

  <footer>

  </footer>
</body>
</html>
